[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deeptutor-reading-extensions"
version = "0.2.0"
description = "Read aloud, contextual vocabulary and quizzes for DeepTutor"
requires-python = ">=3.11,<3.15"
dependencies = ["deeptutor>=1.6.4,<2"]
license = {text = "Apache-2.0"}
readme = "README.md"

[project.entry-points."deeptutor.reading_extensions"]
read_aloud = "deeptutor_reading_extensions.read_aloud:ReadAloudExtension"
vocabulary = "deeptutor_reading_extensions.vocabulary:VocabularyExtension"
quiz = "deeptutor_reading_extensions.quiz:ReadingQuizExtension"

[tool.setuptools.packages.find]
include = ["deeptutor_reading_extensions*"]
